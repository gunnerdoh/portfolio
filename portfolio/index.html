    <script>
      const items = document.querySelectorAll('.item-link');
      const emailButton = document.querySelector('.email-preview');
      const copyStatus = document.querySelector('.copy-status');
      let copyTimer;
      let copyVersion = 0;

      function resetCopyFeedback() {
        copyVersion += 1;
        clearTimeout(copyTimer);
        emailButton.classList.remove('has-copy-feedback');
        copyStatus.textContent = '';
      }

      emailButton.addEventListener('click', async () => {
        resetCopyFeedback();
        const version = copyVersion;
        let message;
        try {
          await navigator.clipboard.writeText('gunnerdoh@gmail.com');
          message = 'Copied';
        } catch {
          message = 'Couldn’t copy';
        }

        if (version !== copyVersion || document.hidden || !document.hasFocus()) return;
        emailButton.classList.remove('is-dismissed');
        emailButton.classList.add('has-copy-feedback');
        copyStatus.textContent = message;
        copyTimer = setTimeout(resetCopyFeedback, 2000);
      });

      function clearPreviews() {
        resetCopyFeedback();
        items.forEach(item => {
          item.classList.add('is-dismissed');
          if (document.activeElement === item) item.blur();
        });
      }

      items.forEach(item => {
        function showPreview() {
          if (document.hasFocus()) {
            if (item !== emailButton) resetCopyFeedback();
            item.classList.remove('is-dismissed');
          }
        }

        // Require a fresh pointer movement or keyboard focus after leaving.
        item.addEventListener('pointerenter', showPreview);
        item.addEventListener('pointermove', showPreview);
        item.addEventListener('focus', showPreview);

        if (item.matches('a[href]')) {
          item.addEventListener('click', clearPreviews);
          item.addEventListener('auxclick', event => {
            if (event.button === 1) clearPreviews();
          });
        }
      });

      window.addEventListener('blur', clearPreviews);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearPreviews();
      });
    </script>
